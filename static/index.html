<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>دنیای بقا</title>
  <link rel="stylesheet" href="style.css" />
  <script src="debug.js"></script>
  <script src="offline-boot.js"></script>
</head>
<body>
  <div id="rotate-wrap">
    <canvas id="game"></canvas>

    <div id="hud-top">
      <div id="hud-left-buttons">
        <button id="btn-help" type="button">❓</button>
        <button id="btn-gps" type="button">📍</button>
      </div>
      <div class="bar"><span class="bar-label">❤️</span><div class="bar-bg"><div id="bar-health" class="bar-fill health" style="width:100%"></div></div></div>
      <div class="bar"><span class="bar-label">🍗</span><div class="bar-bg"><div id="bar-hunger" class="bar-fill hunger" style="width:100%"></div></div></div>
      <div class="bar"><span class="bar-label">💧</span><div class="bar-bg"><div id="bar-thirst" class="bar-fill thirst" style="width:100%"></div></div></div>
      <div class="bar"><span class="bar-label">⚡</span><div class="bar-bg"><div id="bar-stamina" class="bar-fill stamina" style="width:100%"></div></div></div>
    </div>

    <div id="toast"></div>
    <div id="range-label"></div>

    <div id="joystick-zone"><div id="joystick-base"><div id="joystick-stick"></div></div></div>
    <div id="aim-zone"><div id="aim-base"><div id="aim-stick"></div></div></div>

    <div id="action-buttons">
      <button id="btn-dog" type="button">🐶</button>
      <button id="btn-interact" type="button">✋</button>
    </div>

    <div id="bottom-menu">
      <button type="button" data-panel="inventory">🎒 آیتم</button>
      <button type="button" data-panel="craft">🛠️ ساخت</button>
      <button type="button" data-panel="build">🏠 بنا</button>
    </div>

    <div id="panel-overlay" class="hidden">
      <div id="panel-box">
        <div id="panel-header">
          <div id="panel-title"></div>
          <button id="panel-close" type="button">✕</button>
        </div>
        <div id="panel-feedback"></div>
        <div id="panel-content"></div>
      </div>
    </div>

    <div id="loading">در حال بارگذاری دنیا ... (نسخه آفلاین)</div>
  </div>

  <script src="dog.js"></script>
  <script src="cow.js"></script>
  <script src="game.js"></script>
  <script>
    document.getElementById("btn-dog").addEventListener("click", function () {
      if (!dog) return;
      if (dog.isDowned) { toast("سگ زخمیه! اول با غذا درمانش کن 🩹"); return; }
      setDogMode(dog.mode === "collect" ? "attack" : "collect");
    });
    // اگه بازی باز هم گیر کرد، این خط علت رو توی دیباگ می‌نویسه
    setTimeout(function () {
      var el = document.getElementById("loading");
      if (el && el.style.display !== "none") {
        console.error("BOOT-STUCK: dog=" + (typeof dog) + " | state=" + (typeof state) + " | initDog=" + (typeof initDog));
      }
    }, 6000);
  </script>
</body>
</html>
